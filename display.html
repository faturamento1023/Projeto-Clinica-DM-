<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#081d37"><title>Painel de senhas | Clínica DM</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#081d37;color:white}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% -20%,#1d5f9c 0,transparent 45%),linear-gradient(135deg,#07182e,#0c3158)}.screen{min-height:100vh;padding:3vw 4vw;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #ffffff24;padding-bottom:20px}.brand{font-size:clamp(22px,2.6vw,38px);font-weight:850;letter-spacing:-.04em}.brand span{display:inline-grid;place-items:center;width:1.3em;height:1.3em;background:#2185e4;border-radius:.28em;margin-right:.4em}.clock{text-align:right;font-size:clamp(26px,3.5vw,48px);font-weight:700}.clock small{font-size:14px;display:block;color:#aac7e0;margin-top:3px;font-weight:400}.main{flex:1;display:grid;place-items:center;text-align:center;padding:4vh 0}.label{text-transform:uppercase;letter-spacing:.26em;color:#a7cee9;font-size:clamp(16px,1.8vw,26px);font-weight:700}.number{font-size:clamp(110px,20vw,300px);font-weight:900;letter-spacing:-.065em;line-height:1.1;text-shadow:0 18px 45px #0005}.room{font-size:clamp(26px,4vw,60px);font-weight:800;color:#f7be58}.service{font-size:clamp(16px,2vw,29px);color:#b9d4e9;margin-top:12px}.recent{border-top:1px solid #ffffff24;padding-top:20px}.recent h2{font-size:clamp(15px,1.6vw,22px);color:#a7cee9;text-transform:uppercase;letter-spacing:.12em;margin:0 0 13px}.recent-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.recent-item{border-radius:12px;padding:14px 17px;background:#ffffff12;border:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center;gap:8px}.recent-item strong{font-size:clamp(18px,2.5vw,34px)}.recent-item span{color:#c6dcee;font-size:clamp(12px,1.5vw,19px)}.controls{position:fixed;bottom:13px;right:13px;display:flex;gap:7px}.controls button{border:1px solid #ffffff66;color:white;background:#112f52de;border-radius:8px;padding:8px 12px;cursor:pointer}.controls button:hover{background:#1f5b96}.alert{animation:flash 1s ease-in-out 3}@keyframes flash{50%{background:#1b5a94}}@media(max-width:700px){.screen{padding:18px}.recent-list{grid-template-columns:repeat(2,minmax(0,1fr))}.recent-item{padding:10px}.controls{position:static;margin-top:16px;justify-content:flex-end}.number{font-size:27vw}.top{align-items:start}}
</style></head><body><main class="screen"><header class="top"><div class="brand"><span aria-hidden="true">✚</span>Clínica DM</div><div class="clock"><time id="clock">--:--</time><small id="date"></small></div></header><section class="main" id="main"><div><div class="label">Senha chamada</div><div class="number" id="code">—</div><div class="room" id="room">Aguarde a próxima chamada</div><div class="service" id="service"></div></div></section><section class="recent"><h2>Últimas chamadas</h2><div class="recent-list" id="recent"></div></section><div class="controls"><button id="sound" type="button">Ativar voz e som</button><button id="fullscreen" type="button">Tela cheia</button></div></main>
<script>(()=>{'use strict';const KEY='clinica-dm-senhas-v1',$=id=>document.getElementById(id),channel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('clinica-dm-senhas'):null;let soundEnabled=false,lastAnnouncement='';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('date').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});}function announce(t){if(!soundEnabled)return;try{const context=new (window.AudioContext||window.webkitAudioContext)(),osc=context.createOscillator(),gain=context.createGain();osc.type='sine';osc.frequency.value=880;gain.gain.setValueAtTime(.07,context.currentTime);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.35);osc.connect(gain).connect(context.destination);osc.start();osc.stop(context.currentTime+.35);setTimeout(()=>context.close(),700)}catch{}if('speechSynthesis'in window){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(`Senha ${t.code.replace('-',', ')}, ${t.room}`);utterance.lang='pt-BR';utterance.rate=.85;setTimeout(()=>speechSynthesis.speak(utterance),450)}}
function render(){const calls=read().filter(t=>t.date===today()&&t.calledAt).sort((a,b)=>b.calledAt.localeCompare(a.calledAt)),current=calls[0];$('code').textContent=current?.code||'—';$('room').textContent=current?.room||'Aguarde a próxima chamada';$('service').textContent=current?.service||'';const recent=$('recent');recent.replaceChildren();calls.slice(1,5).forEach(t=>{const item=document.createElement('div');item.className='recent-item';const code=document.createElement('strong');code.textContent=t.code;const room=document.createElement('span');room.textContent=t.room;item.append(code,room);recent.append(item)});if(current){const key=`${current.id}:${current.calledAt}`;if(lastAnnouncement && key!==lastAnnouncement){announce(current);$('main').classList.remove('alert');void $('main').offsetWidth;$('main').classList.add('alert')}lastAnnouncement=key}else lastAnnouncement=''}
$('sound').addEventListener('click',()=>{soundEnabled=!soundEnabled;$('sound').textContent=soundEnabled?'Voz e som ativados':'Ativar voz e som';if(soundEnabled&&'speechSynthesis'in window){speechSynthesis.speak(new SpeechSynthesisUtterance(''))}});$('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});window.addEventListener('storage',e=>{if(e.key===KEY)render()});channel?.addEventListener('message',render);tick();render();setInterval(tick,1000);setInterval(render,3000)})();</script></body></html>
